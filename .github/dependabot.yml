version: 2
updates:
  # SPM is omitted on purpose: Mothball has zero external Swift dependencies
  # (Package.swift `dependencies: []`). Re-add a `swift` ecosystem entry only
  # if that changes.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    # All github-actions updates collapse into one grouped PR via the
    # `actions` pattern below, so the limit is effectively 1. Keep it
    # honest rather than carry dead headroom.
    open-pull-requests-limit: 1
    groups:
      actions:
        patterns: ["*"]
