name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Default to least-privilege at the workflow level. Individual jobs may
# escalate one scope at a time if they need it. This build/test only
# reads code, so contents:read is enough.
permissions:
  contents: read

jobs:
  build:
    name: Build & test (macOS)
    # macos-latest only. Previous matrix added macos-13 to exercise the
    # floor of the README's "macOS 13+" support window, but GitHub-hosted
    # macos-13 runner capacity has effectively dried up in 2026-05
    # (3.5h+ queue with no scheduling) so it blocks every PR. The macOS
    # 13 promise is now exercised manually before each tagged release
    # rather than per-commit on CI.
    runs-on: macos-latest
    steps:
      # v6 / v5 are the Node 24 generation; v4 emits a deprecation
      # warning as of 2026-05 and will hard-fail after the 2026-09 cutoff.
      - uses: actions/checkout@v6

      - name: Show toolchain
        run: |
          swift --version
          xcrun --show-sdk-path
          /usr/bin/git --version
          /usr/bin/tar --version | head -1

      - name: Cache .build
        uses: actions/cache@v5
        with:
          path: .build
          # No external SPM deps → no Package.resolved. Key on Package.swift
          # and the workflow itself so cache invalidates on either a package
          # edit or a runner image / toolchain pin bump.
          key: ${{ runner.os }}-spm-${{ hashFiles('Package.swift') }}-${{ hashFiles('.github/workflows/ci.yml') }}
          restore-keys: |
            ${{ runner.os }}-spm-

      - name: Build
        run: swift build --build-tests

      - name: Test
        run: swift test --skip-build
